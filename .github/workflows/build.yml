name: PS3 G923 build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      PS3DEV_BUILD_DIR: /tmp/ps3dev-build
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install PS3DEV prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make \
            texinfo libncurses5-dev patch python3 python-is-python3 subversion wget \
            zlib1g-dev libtool libtool-bin bzip2 libgmp-dev pkg-config g++ libssl-dev clang

      - name: Build PS3DEV toolchain and SDK
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3dev.git "$RUNNER_TEMP/ps3dev-src"
          cd "$RUNNER_TEMP/ps3dev-src"
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$USER":"$USER" "$PS3DEV"
          ./prepare.sh
          ./build-all.sh
          test -x "$PS3DEV/bin/ppu-gcc" || test -x "$PS3DEV/ppu/bin/ppu-gcc"

      - name: Add PS3DEV tools to PATH
        run: |
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Build diagnostic SELF and PKG
        run: |
          make clean
          make
          make pkg

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ps3-g923-diagnostic
          path: |
            G923Diag.self
            G923Diag.pkg
          if-no-files-found: error
